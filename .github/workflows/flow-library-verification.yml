name: Directed flow-cut library verification
on:
  push:
    branches:
      - codex/flow-library-20261119
      - codex/flow-vertex-runtime-20261119
      - codex/flow-round-state-20261119
      - codex/flow-midpoint-round-20261119
      - codex/flow-guarded-epoch-20261119
      - codex/flow-residual-matrix-20261119
      - codex/flow-residual-augmentation-20261119
      - codex/flow-physical-min-cut-20261119
      - codex/flow-candidate-closure-20261119
      - codex/flow-candidate-capacities-20261119
      - codex/flow-candidate-setup-20261119
      - codex/flow-candidate-numerators-20261119
      - codex/flow-raw-candidate-20261119
      - codex/flow-epoch-input-20261119
      - codex/flow-selected-epoch-round-20261119
      - codex/flow-candidate-refresh-20261119
      - codex/flow-adaptive-round-refresh-20261119
      - codex/flow-ci-runtime-20261119
      - codex/flow-physical-epoch-scan-20261119
      - codex/flow-physical-controller-20261119
      - codex/flow-original-controller-20261119
      - codex/flow-control-fixture-20261119
      - codex/flow-raw-controller-20261119
      - codex/flow-amplified-solver-20261119
  workflow_dispatch:
permissions:
  contents: read
env:
  LEAN_NUM_THREADS: 1
jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Bind exact source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD --
          python3 scripts/CheckReferenceRecovery.py
      - uses: leanprover/lean-action@a1e4f67744f24ab80ec3c7ab1bd37d7d419207d5
        with:
          auto-config: "false"
          build: "true"
          build-args: "+DirectedFlowCutGap Cli"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          mk_all-check: "false"
          axiom-audit: "false"
      - name: Check all project imports, audit, replay, and execute the binary routines
        run: bash scripts/CheckFlowLibrary.sh
      - name: Check the composed vertex modes and adaptive width proof
        run: bash scripts/CheckFlowChargedVertex.sh
      - name: Check the fixed sampled-cut state update
        if: github.ref_name == 'codex/flow-round-state-20261119' || github.ref_name == 'codex/flow-midpoint-round-20261119' || github.ref_name == 'codex/flow-guarded-epoch-20261119' || github.ref_name == 'codex/flow-residual-matrix-20261119' || github.ref_name == 'codex/flow-residual-augmentation-20261119' || github.ref_name == 'codex/flow-physical-min-cut-20261119' || github.ref_name == 'codex/flow-candidate-closure-20261119' || github.ref_name == 'codex/flow-candidate-capacities-20261119' || github.ref_name == 'codex/flow-candidate-setup-20261119' || github.ref_name == 'codex/flow-candidate-numerators-20261119' || github.ref_name == 'codex/flow-raw-candidate-20261119' || github.ref_name == 'codex/flow-epoch-input-20261119' || github.ref_name == 'codex/flow-selected-epoch-round-20261119' || github.ref_name == 'codex/flow-candidate-refresh-20261119' || github.ref_name == 'codex/flow-adaptive-round-refresh-20261119' || github.ref_name == 'codex/flow-ci-runtime-20261119' || github.ref_name == 'codex/flow-physical-epoch-scan-20261119' || github.ref_name == 'codex/flow-physical-controller-20261119' || github.ref_name == 'codex/flow-original-controller-20261119' || github.ref_name == 'codex/flow-control-fixture-20261119' || github.ref_name == 'codex/flow-raw-controller-20261119' || github.ref_name == 'codex/flow-amplified-solver-20261119'
