name: Polynomial adaptive packing bit budget
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Bind finite-prefix source and unchanged baseline
        run: python3 scripts/CheckHeavyPackingBudgetSnapshot.py
      - uses: leanprover/lean-action@a1e4f67744f24ab80ec3c7ab1bd37d7d419207d5
        with:
          auto-config: "false"
          build: "true"
          build-args: "+DirectedFlowCutGap.BinaryControllerPrefix +DirectedFlowCutGap.BinaryControllerTrees +DirectedFlowCutGap.BinaryEntryTrees +DirectedFlowCutGap.BinaryFullPrefix +DirectedFlowCutGap.BinaryFullPrefixCost +DirectedFlowCutGap.BinaryHeavyPrefix +DirectedFlowCutGap.BinaryHeavyProviderTrees +DirectedFlowCutGap.BinaryPackingBudget +DirectedFlowCutGap.BinaryPackingPrefixBudget +DirectedFlowCutGap.BinaryPackingTrees +DirectedFlowCutGap.BinaryRepeatedPrefix +DirectedFlowCutGap.BinaryRepetitionTrees +DirectedFlowCutGap.BinarySamplerTrees +DirectedFlowCutGap.BinaryTapeBudget +DirectedFlowCutGap.BinaryTapePrefix +DirectedFlowCutGap.BinaryTapeTrees +DirectedFlowCutGap.BinaryTicketTrees +DirectedFlowCutGap.BinaryTrackedPrefix +DirectedFlowCutGap.BinaryWeightedPackingTrees +DirectedFlowCutGap.BinaryWeightedTrees +DirectedFlowCutGap.FiniteBinaryPrefix +DirectedFlowCutGap.FiniteHeavyCertificate +DirectedFlowCutGap.FiniteRoundingCertificate +DirectedFlowCutGap.FiniteSupportTrees +DirectedFlowCutGap.HeavyPackingBitBudget +DirectedFlowCutGap.HeavyPackingEntry +DirectedFlowCutGap.HeavyPackingPrefix +DirectedFlowCutGap.HeavyQueryBitBudget +DirectedFlowCutGap.QueryBudgetArithmetic +DirectedFlowCutGap.QueryBudgetPolynomial +DirectedFlowCutGap.StatefulHeavyPathwise +DirectedFlowCutGap.StatefulTreeInterpreter"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          mk_all-check: "false"
          axiom-audit: "false"
      - name: Strictly compile finite-prefix realization
        run: |
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/BinaryTrackedPrefix.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/FiniteBinaryPrefix.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/BinarySamplerTrees.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/BinaryFullPrefix.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/BinaryFullPrefixCost.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/BinaryTapeTrees.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/BinaryTapeBudget.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/BinaryTapePrefix.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/StatefulTreeInterpreter.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/BinaryControllerTrees.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/BinaryControllerPrefix.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/BinaryEntryTrees.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/BinaryRepetitionTrees.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/BinaryRepeatedPrefix.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/FiniteRoundingCertificate.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/BinaryWeightedTrees.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/BinaryHeavyPrefix.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/StatefulHeavyPathwise.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/FiniteHeavyCertificate.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/FiniteSupportTrees.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/BinaryTicketTrees.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/BinaryHeavyProviderTrees.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/BinaryPackingTrees.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/BinaryWeightedPackingTrees.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/HeavyPackingPrefix.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/HeavyPackingEntry.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/QueryBudgetArithmetic.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/HeavyQueryBitBudget.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/QueryBudgetPolynomial.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/BinaryPackingBudget.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/BinaryPackingPrefixBudget.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/HeavyPackingBitBudget.lean"
      - name: Audit every owned declaration in the finite-prefix closure
        run: lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/verification/HeavyPackingBudgetAudit.lean"
      - name: Replay finite-prefix source closure through the kernel
        run: python3 scripts/HeavyPackingBudgetKernelCheck.py
