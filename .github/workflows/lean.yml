name: Finite fair-prefix storage order
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Bind finite-prefix source and unchanged baseline
        run: python3 scripts/CheckFiniteBinaryPrefixSnapshot.py
      - uses: leanprover/lean-action@a1e4f67744f24ab80ec3c7ab1bd37d7d419207d5
        with:
          auto-config: "false"
          build: "true"
          build-args: "+DirectedFlowCutGap.FiniteBinaryPrefix +DirectedFlowCutGap.FinitePrefixOrder"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          mk_all-check: "false"
          axiom-audit: "false"
      - name: Strictly compile finite-prefix realization
        run: lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/FiniteBinaryPrefix.lean"
      - name: Strictly compile finite-prefix reversal law
        run: lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/FinitePrefixOrder.lean"
      - name: Audit every owned declaration in the finite-prefix closure
        run: lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/verification/FiniteBinaryPrefixAudit.lean"
      - name: Replay finite-prefix source closure through the kernel
        run: python3 scripts/FiniteBinaryPrefixKernelCheck.py
