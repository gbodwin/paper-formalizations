name: Concrete shared-ledger bounded-bit quality
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Bind probability proof and inherited source closure
        run: python3 scripts/CheckStatefulBoundedRoundingQualitySnapshot.py
      - uses: leanprover/lean-action@a1e4f67744f24ab80ec3c7ab1bd37d7d419207d5
        with:
          auto-config: "false"
          build: "true"
          build-args: "+DirectedFlowCutGap.StatefulBoundedRoundingQuality"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          mk_all-check: "false"
          axiom-audit: "false"
      - name: Strictly compile concrete shared-ledger bounded-bit quality
        run: |
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/AllRegimeBoundedTapeLaw.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/StatefulBoundedRoundingQuality.lean"
      - name: Audit every owned declaration in the probability closure
        run: lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/verification/StatefulBoundedRoundingQualityAudit.lean"
      - name: Replay probability source closure through the kernel
        run: python3 scripts/StatefulBoundedRoundingQualityKernelCheck.py
