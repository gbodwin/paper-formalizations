name: Lean
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leanprover/lean-action@a1e4f67744f24ab80ec3c7ab1bd37d7d419207d5
        with:
          auto-config: "false"
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          mk_all-check: "false"
          axiom-audit: "true"
          axiom-audit-root: "VFTSpanners"
          axiom-audit-allow: "propext,Classical.choice,Quot.sound"
      - name: Check all paper module indexes
        run: bash scripts/CheckModuleIndex.sh
      - name: Audit every declaration in all paper libraries
        run: lake env lean scripts/AxiomAudit.lean
      - name: Strictly compile and safety-audit reconstructed actual Minor phases
        run: |
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/ActualPhaseAlternative.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/ActualRetainedPhase.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/ActualSelectedRadiusFloor.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/ActualShortRadiusFloor.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/ActualWeakRadiusFloor.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/CanonicalActualPhase.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/CanonicalCorrectedGirth.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/CanonicalPhaseNumerics.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/CanonicalPhaseParameterChoice.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/CanonicalScaleChoice.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/CoarsenedConnectorFreshness.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/EmptyRootStreamBudget.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/EmptySelectedTree.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/FiniteHistoryLedger.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/FreshFiniteRetainedPhaseOutput.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/FreshShortToRetainedFamily.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/GeometricScaleBudget.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/OriginalRootRadiusFloor.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/RetainedHistoryStep.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/RetainedPhaseCapTransport.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/RetainedScaleState.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/SelectedClassHeavyInputs.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/SelectedResidualCoarsening.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/SelectedSpendingRadiusFloor.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/SingletonAnchorCredit.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/SingletonAnchorEdges.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/SingletonAnchorPriorLedger.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/SingletonAnchorRetainedPhase.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/SingletonAnchorShortPhase.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/SingletonAnchorTransport.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/SingletonAnchorTree.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/SingletonClusterBase.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/UnitTreeHeavyScaleBound.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/WeightPrefixHost.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/verification/reconstructed-phase452/ReconstructedSafetyAudit.lean"
      - name: Strictly compile and safety-audit constructed Minor lightness
        run: |
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/CanonicalFiniteStream.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/CanonicalFreshPaidPhase.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/CanonicalFreshPhaseAlternative.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/CanonicalHistoryStep.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/CanonicalPrefixHistoryStep.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/CanonicalStreamBudget.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/ConstructedGeometricStream.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/FiniteGeometricStreamBound.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/FreshActualPhaseAlternative.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/FreshActualRetainedPhase.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/FreshRetainedPhaseCapTransport.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/InitialPrefixState.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/DyadicStreamCover.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/FiniteCoverBudget.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/HeavyStreamsBudget.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/HeavyGraphBudget.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/NonnegativeWeightedGirth.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/LowGraphBudget.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/UnitTreeGraphBudget.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/CorrectedUnitTreeLightness.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/NormalizedMinorLightness.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/MinorFreeSpanners/GreedyMinorLightness.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Multiplicative Spanners in Minor-Free Graphs/verification/constructed-lightness474/CompleteHierarchySafetyAudit.lean"
      - name: Replay every project module through the Lean kernel
        run: bash scripts/KernelCheck.sh
