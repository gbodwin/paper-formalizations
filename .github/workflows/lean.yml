name: Weighted and tape execution diagnostic
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Bind all inherited proof sources and new runtime fixture
        run: python3 scripts/CheckWeightedTapeSnapshot.py
      - uses: leanprover/lean-action@a1e4f67744f24ab80ec3c7ab1bd37d7d419207d5
        with:
          auto-config: "false"
          build: "true"
          build-args: "+DirectedFlowCutGap.BinaryWeightedSampling +DirectedFlowCutGap.BinaryRetainedTape"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          mk_all-check: "false"
          axiom-audit: "false"
      - name: Execute four weighted and tape fixture groups
        timeout-minutes: 10
        run: |
          set -euo pipefail
          runtime_log="$(mktemp)"
          trap 'rm -f "$runtime_log"' EXIT
          lake env lean -DautoImplicit=false -DwarningAsError=true --run "Improved Upper Bounds for the Directed Flow-Cut Gap/verification/WeightedTapeExecutionSmoke.lean" 2>&1 | tee "$runtime_log"
          python3 scripts/CheckWeightedTapeOutput.py "$runtime_log"
