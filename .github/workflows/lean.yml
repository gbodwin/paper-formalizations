name: Lean
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leanprover/lean-action@a1e4f67744f24ab80ec3c7ab1bd37d7d419207d5
        with:
          auto-config: "false"
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          mk_all-check: "true"
          mk_all-args: "--lib BodwinPapers"
          axiom-audit: "true"
          axiom-audit-root: "BodwinPapers"
          axiom-audit-allow: "propext,Classical.choice,Quot.sound"
      - name: Print axioms of the exported theorems
        run: lake env lean scripts/AxiomAudit.lean
