          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/GraphRelaxationRefinement.lean"
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/verification/GraphRelaxationSafetyAudit.lean"
      - name: Execute eleven actual adjacency-driven graph relaxation fixtures
        run: lake env lean -DautoImplicit=false -DwarningAsError=true --run "Improved Upper Bounds for the Directed Flow-Cut Gap/verification/GraphRelaxationSmoke.lean"
      - name: Strictly compile and safety-audit actual candidate construction and selection
        run: |
          lake env lean -DautoImplicit=false -DwarningAsError=true "Improved Upper Bounds for the Directed Flow-Cut Gap/DirectedFlowCutGap/CostedCandidateMaterialization.lean"
